<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta charset="UTF-8" />
  <title>Clicks Per Second Test</title>
  <style>
    /* Forzamos el color de fondo y evitamos selección general por comodidad */
    html, body {
      background-color: #FDFBF7 !important;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 20px;
      margin: 0;
      /* Evita que se marque de azul todo el cuerpo por accidente */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .bordered-container {
      position: relative;
      padding: 50px 40px;
      margin: 21px auto;
      max-width: 600px;
      background-color: #FDFBF7 !important; /* Fondo crema asegurado */
      box-sizing: border-box;
      border-radius: 30px;
      
      /* --- BORDE DE ALFOMBRA IMPECABLE --- */
      border: 35px solid transparent;
      border-image-source: url('Borde.png');
      border-image-slice: 33%;
      border-image-repeat: round;
      border-image-width: 35px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    /* --- ESTILOS PARA LOS BOTONES DE SELECCIÓN DE TIEMPO --- */
    #time-selector {
      margin-bottom: 20px;
    }

    .time-btn {
      padding: 8px 16px;
      font-size: 0.9rem;
      margin: 3px;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid #dcd6cd;
      background-color: #f4efe6;
      color: #555;
      font-weight: bold;
      transition: all 0.2s ease;
      
      /* Evita selección de texto en los botones de tiempo */
      -webkit-user-select: none;
      user-select: none;
    }

    .time-btn:hover {
      background-color: #e8e2d5;
      border-color: #c7beaf;
    }

    .time-btn.active {
      background-color: #e67e22; /* Tono cálido acorde al borde naranja */
      color: white;
      border-color: #d35400;
    }

    #timer {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    #score {
      font-size: 3rem;
      margin: 20px 0;
    }
    button#clicker {
      padding: 40px 80px;
      font-size: 2rem;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.3s ease;
      
      /* Evita la selección azul al hacer clics rápidos y masivos */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      outline: none; /* Quita el borde de enfoque molesto al hacer click rápido */
    }
    button#clicker:hover {
      background-color: #45a049;
    }
    #resetBtn {
      padding: 12px 25px;
      font-size: 1.1rem;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: background-color 0.3s ease;
      margin-top: 10px;
      
      -webkit-user-select: none;
      user-select: none;
    }
    #resetBtn:hover {
      background-color: #da190b;
    }
    #stats {
      margin-top: 20px;
      font-size: 1.2rem;
      line-height: 1.5;
      display: none;
      border: 2px solid #4CAF50;
      border-radius: 10px;
      padding: 15px;
      max-width: 350px;
      margin-left: auto;
      margin-right: auto;
      background-color: #FDFBF7;
      color: #333;
    }
    #instructions {
      font-size: 0.95rem;
      margin-bottom: 15px;
      color: #555;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <div class="bordered-container">
    <h1>Clicks Per Second Test</h1>
    
    <!-- Selector de tiempo elegante -->
    <div id="time-selector">
      <button class="time-btn" onclick="setTime(1)">1s</button>
      <button class="time-btn" onclick="setTime(5)">5s</button>
      <button class="time-btn" onclick="setTime(10)">10s</button>
      <button class="time-btn active" onclick="setTime(20)">20s</button>
    </div>

    <div id="instructions">
      <p>Elige el tiempo, haz clic en el botón tantas veces como puedas y ¡mide tus CPS!</p>
    </div>
    <div id="timer">Time left: 20,00 seg</div>
    <div id="score">0</div>
    <button id="clicker">Click Me!</button>
    <div>
      <button id="resetBtn">Restart</button>
    </div>

    <div id="stats">
      <p><strong>Game stats:</strong></p>
      <p>Max CPS: <span id="maxCPS">0</span></p>
      <p>Avg. CPS: <span id="avgCPS">0</span></p>
      <p>Min CPS: <span id="minCPS">0</span></p>
      <p>Récord personal (total clicks): <span id="personalRecord">0</span></p>
    </div>
  </div>

  <script>
    let timeTotal = 20;
    let timeLeft = timeTotal;
    let score = 0;
    let timer = null;
    let cpsHistory = [];
    let clicksThisSecond = 0;
    let gameStarted = false;
    let lastSecondChecked = 20;

    const timerElement = document.getElementById('timer');
    const scoreElement = document.getElementById('score');
    const clicker = document.getElementById('clicker');
    const resetBtn = document.getElementById('resetBtn');
    const statsDiv = document.getElementById('stats');
    const maxCPSElement = document.getElementById('maxCPS');
    const avgCPSElement = document.getElementById('avgCPS');
    const minCPSElement = document.getElementById('minCPS');
    const personalRecordElement = document.getElementById('personalRecord');
    const timeButtons = document.querySelectorAll('.time-btn');

    function formatTime(seconds) {
      return seconds.toFixed(2).replace('.', ',') + ' seg';
    }

    function setTime(seconds) {
      if (gameStarted && timer !== null) return; 
      timeTotal = seconds;
      timeLeft = seconds;
      lastSecondChecked = seconds;
      timerElement.textContent = `Time left: ${formatTime(timeLeft)}`;

      timeButtons.forEach(btn => {
        if (btn.textContent === seconds + 's') {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function updateStats() {
      if (cpsHistory.length === 0) return;

      const max = Math.max(...cpsHistory);
      const min = Math.min(...cpsHistory);
      const avg = (cpsHistory.reduce((a, b) => a + b, 0) / cpsHistory.length).toFixed(2);

      maxCPSElement.textContent = max;
      minCPSElement.textContent = min;
      avgCPSElement.textContent = avg;

      let personalRecord = localStorage.getItem('clickerPersonalRecord_' + timeTotal);
      personalRecord = personalRecord ? parseInt(personalRecord, 10) : 0;
      if (score > personalRecord) {
        localStorage.setItem('clickerPersonalRecord_' + timeTotal, score);
        personalRecord = score;
      }
      personalRecordElement.textContent = personalRecord;
    }

    function startTimer() {
      if (timer) return;
      gameStarted = true;

      timeButtons.forEach(btn => btn.style.opacity = '0.6');

      let startTime = performance.now();
      let durationMs = timeTotal * 1000;

      timer = setInterval(() => {
        let elapsed = performance.now() - startTime;
        let remainingMs = durationMs - elapsed;
        
        if (remainingMs <= 0) {
          timeLeft = 0;
          timerElement.textContent = `Time left: ${formatTime(timeLeft)}`;
          clearInterval(timer);
          timer = null;
          clicker.disabled = true;
          resetBtn.style.display = 'inline-block';
          statsDiv.style.display = 'block';
          
          cpsHistory.push(clicksThisSecond);
          clicksThisSecond = 0;
          updateStats();
          return;
        }

        timeLeft = remainingMs / 1000;
        timerElement.textContent = `Time left: ${formatTime(timeLeft)}`;

        let currentSecondFloor = Math.ceil(timeLeft);
        if (currentSecondFloor < lastSecondChecked) {
          cpsHistory.push(clicksThisSecond);
          clicksThisSecond = 0;
          lastSecondChecked = currentSecondFloor;
        }
      }, 10);
    }

    clicker.addEventListener('click', () => {
      if (timeLeft > 0) {
        score++;
        clicksThisSecond++;
        scoreElement.textContent = score;
        startTimer();
      }
    });

    resetBtn.addEventListener('click', () => {
      score = 0;
      timeLeft = timeTotal;
      lastSecondChecked = timeTotal;
      cpsHistory = [];
      clicksThisSecond = 0;
      gameStarted = false;
      timerElement.textContent = `Time left: ${formatTime(timeLeft)}`;
      scoreElement.textContent = score;
      clicker.disabled = false;
      resetBtn.style.display = 'none';
      statsDiv.style.display = 'none';

      timeButtons.forEach(btn => btn.style.opacity = '1');
    });
  </script>
</body>
</html>
